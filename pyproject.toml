[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcs"
version = "0.1.0"
description = "Personal Command Sheets – topic-organized Linux CLI cheat sheets with real usage examples and man integration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Heath D. Robertson"}
]
keywords = ["cli", "cheat-sheet", "linux", "man", "personal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
pcs = "pcs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcs*"]

[tool.setuptools.package-data]
pcs = ["../sheets/*.md"]
